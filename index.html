[hidden]{display:none!important}

main{max-width:640px;margin:auto;padding:12px}
section{display:none}section.on{display:block}
.w{background:var(--c);border:1px solid var(--b);border-radius:16px;margin-bottom:12px;overflow:hidden}

.r{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:7px 14px;border-top:1px solid var(--b)}
.r b{font-weight:400;color:var(--m);font-size:14px}
.r span{direction:ltr;unicode-bidi:isolate;text-align:left;font-variant-numeric:tabular-nums}
[dir=rtl] .r span.rt{direction:rtl}
.nx{background:var(--h)}.nx b{color:var(--a);font-weight:700}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--m);padding:7px 0;font-size:11px}
nav button.on{color:var(--a);font-weight:700}
nav i{display:block;font-size:20px;font-style:normal}
.sg{display:flex;gap:6px;padding:10px 14px}
.sg button,.f button{border:1px solid var(--b);background:var(--bg);color:var(--t);border-radius:10px;padding:8px 12px}
.sg button{flex:1}.sg button.on{background:var(--a);color:var(--c);border-color:var(--a)}
.f{display:flex;align-items:center;gap:6px;padding:6px 14px}.f label{flex:0 0 118px;color:var(--m);font-size:13px}
input{flex:1;min-width:0;font:inherit;color:var(--t);background:var(--bg);border:1px solid var(--b);border-radius:10px;padding:8px;direction:ltr;text-align:center}

#ms{flex:1;color:var(--m);font-size:13px}
.clk{font-size:46px;font-weight:600;text-align:center;direction:ltr;color:var(--a);padding-top:12px;font-variant-numeric:tabular-nums}
.dy,.hj{text-align:center}.hj{color:var(--m);padding-bottom:14px}
.hero{display:flex;align-items:center;gap:16px;padding:14px}.hero .ph{font-size:20px;font-weight:600;color:var(--a)}
